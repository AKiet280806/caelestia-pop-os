name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install static check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: Installer safety and usage parsing tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s src/codex-usage -v
          python3 scripts/runtime-metadata.py validate
          python3 tests/check_sources.py
      - name: Shell checks
        run: |
          shellcheck setup.sh installer/runtime*.sh scripts/build-plugins.sh scripts/start-* scripts/open-*
          ./setup.sh --help
          ./setup.sh install --dry-run --with-codex --with-hyprmod --vietnamese --scale 1.5
